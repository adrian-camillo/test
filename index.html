<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruleta Interactiva</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --accent: #e94560;
      --gold: #f5a623;
      --text: #e0e0e0;
      --muted: #888;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
    }
    header h1 span { color: var(--accent); }
    header p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }

    .main {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      max-width: 1000px;
    }

    /* ── WHEEL ── */
    .wheel-wrapper {
      position: relative;
      width: 340px;
      height: 340px;
      flex-shrink: 0;
    }

    .wheel-wrapper::before {          /* pointer */
      content: '';
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid var(--gold);
      z-index: 10;
      filter: drop-shadow(0 2px 6px rgba(245,166,35,.6));
    }

    canvas#wheel {
      border-radius: 50%;
      box-shadow: 0 0 0 6px #2a2a3e, 0 0 0 10px var(--accent), 0 8px 40px rgba(233,69,96,.4);
      display: block;
      cursor: pointer;
      transition: box-shadow .3s;
    }
    canvas#wheel:hover { box-shadow: 0 0 0 6px #2a2a3e, 0 0 0 10px var(--gold), 0 8px 50px rgba(245,166,35,.5); }

    .hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 52px; height: 52px;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #ccc 60%, #888 100%);
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(0,0,0,.5);
      pointer-events: none;
      z-index: 5;
    }

    /* ── PANEL ── */
    .panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 24px;
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 4px 30px rgba(0,0,0,.4);
    }

    .panel h2 {
      font-size: 1.1rem;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    /* items editor */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 230px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .items-list::-webkit-scrollbar { width: 4px; }
    .items-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .item-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .item-row input[type="text"] {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 6px 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color .2s;
    }
    .item-row input[type="text"]:focus { border-color: var(--accent); }
    .item-row .color-dot {
      width: 22px; height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s;
    }
    .item-row .color-dot:hover { transform: scale(1.15); }
    .item-row .remove-btn {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0 2px;
      transition: color .2s;
    }
    .item-row .remove-btn:hover { color: var(--accent); }

    .add-row {
      display: flex;
      gap: 8px;
    }
    .add-row input[type="text"] {
      flex: 1;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 7px 10px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .add-row input[type="text"]:focus { border-color: var(--gold); }
    .add-row button {
      background: var(--gold);
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity .2s, transform .1s;
    }
    .add-row button:hover { opacity: .85; transform: scale(1.04); }

    .spin-btn {
      background: linear-gradient(135deg, var(--accent), #c0392b);
      border: none;
      border-radius: 8px;
      padding: 14px;
      color: #fff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 4px 16px rgba(233,69,96,.4);
    }
    .spin-btn:hover:not(:disabled) { opacity: .9; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,.55); }
    .spin-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    /* result */
    .result-box {
      background: #0f0f1a;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      border: 1px solid #333;
      transition: border-color .3s;
    }
    .result-box.has-result { border-color: var(--gold); }
    .result-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .result-value {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold);
      word-break: break-word;
      animation: pop .35s ease;
    }
    @keyframes pop {
      0%   { transform: scale(.7); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* history */
    .history-title { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .history-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 80px;
      overflow-y: auto;
    }
    .chip {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 600;
      color: #111;
    }

    footer {
      margin-top: 40px;
      font-size: .8rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>Ruleta <span>Interactiva</span></h1>
  <p>Agregá opciones, girá y dejá que el azar decida</p>
</header>

<div class="main">
  <div class="wheel-wrapper">
    <canvas id="wheel" width="340" height="340"></canvas>
    <div class="hub"></div>
  </div>

  <div class="panel">
    <h2>Opciones</h2>

    <div class="items-list" id="itemsList"></div>

    <div class="add-row">
      <input type="text" id="newItemInput" placeholder="Nueva opción…" maxlength="30" />
      <button id="addBtn">+</button>
    </div>

    <button class="spin-btn" id="spinBtn">Girar</button>

    <div class="result-box" id="resultBox">
      <span class="result-label">Resultado</span>
      <span class="result-value" id="resultValue" style="color:var(--muted);font-size:1rem">—</span>
    </div>

    <div>
      <div class="history-title">Historial</div>
      <div class="history-chips" id="historyChips"></div>
    </div>
  </div>
</div>

<footer>Haz clic en la ruleta o en el botón para girar</footer>

<script>
  // ── palette ──────────────────────────────────────────────
  const PALETTE = [
    '#e94560','#f5a623','#2ecc71','#3498db','#9b59b6',
    '#1abc9c','#e67e22','#e91e63','#00bcd4','#8bc34a',
    '#ff5722','#607d8b','#ff9800','#4caf50','#673ab7',
    '#03a9f4','#f44336','#cddc39',
  ];

  // ── state ─────────────────────────────────────────────────
  let items = [
    'Opción 1','Opción 2','Opción 3','Opción 4','Opción 5','Opción 6',
  ].map((label, i) => ({ label, color: PALETTE[i % PALETTE.length] }));

  let spinning = false;
  let currentAngle = 0;   // radians, total rotation
  let history = [];

  // ── canvas ────────────────────────────────────────────────
  const canvas = document.getElementById('wheel');
  const ctx    = canvas.getContext('2d');
  const SIZE   = canvas.width;
  const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 4;

  function drawWheel(angle) {
    ctx.clearRect(0, 0, SIZE, SIZE);
    if (items.length === 0) {
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(CX, CY, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#888';
      ctx.font = '16px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText('Agrega opciones', CX, CY);
      return;
    }

    const slice = (Math.PI * 2) / items.length;

    items.forEach((item, i) => {
      const start = angle + slice * i;
      const end   = start + slice;
      const mid   = start + slice / 2;

      // sector
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, start, end);
      ctx.closePath();
      ctx.fillStyle = item.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.3)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // text
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,.6)';
      ctx.shadowBlur = 3;
      const fontSize = Math.max(10, Math.min(15, 320 / items.length / 1.5));
      ctx.font = `bold ${fontSize}px Segoe UI`;
      const maxLen = R - 28;
      let label = item.label;
      while (ctx.measureText(label).width > maxLen && label.length > 1) label = label.slice(0,-1) + '…';
      ctx.fillText(label, R - 12, fontSize * .35);
      ctx.restore();
    });

    // outer ring
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,.15)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  // ── animation ─────────────────────────────────────────────
  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function spin() {
    if (spinning || items.length < 2) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    const extra    = Math.PI * 2 * (8 + Math.random() * 6);   // 8–14 full turns
    const duration = 4000 + Math.random() * 1500;              // 4–5.5 s
    const start    = performance.now();
    const startAngle = currentAngle;

    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(elapsed / duration, 1);
      currentAngle = startAngle + extra * easeOut(t);
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        currentAngle = currentAngle % (Math.PI * 2);
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        showResult();
      }
    }
    requestAnimationFrame(frame);
  }

  function showResult() {
    // pointer is at the top (−π/2), find which slice it lands on
    const slice = (Math.PI * 2) / items.length;
    // normalize angle so 0 = right, pointer is at top = subtract π/2 offset
    const norm = ((Math.PI * 2) - (currentAngle % (Math.PI * 2))) % (Math.PI * 2);
    // pointer at top = π/2 from 0 in standard coords
    const pointer = (norm + Math.PI / 2) % (Math.PI * 2);
    const idx = Math.floor(pointer / slice) % items.length;
    const item = items[idx];

    const box = document.getElementById('resultBox');
    const val = document.getElementById('resultValue');
    val.textContent = item.label;
    val.style.color = item.color;
    box.classList.add('has-result');

    // history
    history.unshift(item);
    if (history.length > 20) history.pop();
    renderHistory();
  }

  // ── render helpers ────────────────────────────────────────
  function renderItems() {
    const list = document.getElementById('itemsList');
    list.innerHTML = '';
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'item-row';

      const dot = document.createElement('div');
      dot.className = 'color-dot';
      dot.style.background = item.color;
      dot.title = 'Cambiar color';
      dot.onclick = () => {
        item.color = PALETTE[(PALETTE.indexOf(item.color) + 1) % PALETTE.length];
        renderItems();
        drawWheel(currentAngle);
      };

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = item.label;
      inp.maxLength = 30;
      inp.oninput = () => { item.label = inp.value; drawWheel(currentAngle); };

      const rm = document.createElement('button');
      rm.className = 'remove-btn';
      rm.textContent = '✕';
      rm.onclick = () => {
        items.splice(i, 1);
        renderItems();
        drawWheel(currentAngle);
      };

      row.append(dot, inp, rm);
      list.appendChild(row);
    });
  }

  function renderHistory() {
    const container = document.getElementById('historyChips');
    container.innerHTML = '';
    history.forEach(item => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = item.label;
      chip.style.background = item.color;
      container.appendChild(chip);
    });
  }

  // ── events ────────────────────────────────────────────────
  document.getElementById('spinBtn').onclick = spin;
  canvas.onclick = spin;

  document.getElementById('addBtn').onclick = () => {
    const inp = document.getElementById('newItemInput');
    const label = inp.value.trim();
    if (!label) return;
    items.push({ label, color: PALETTE[items.length % PALETTE.length] });
    inp.value = '';
    renderItems();
    drawWheel(currentAngle);
  };

  document.getElementById('newItemInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
  });

  // ── init ──────────────────────────────────────────────────
  renderItems();
  drawWheel(currentAngle);
</script>
</body>
</html>
